function resizeImageToDataUrl(file, maxSize = 160, format = "jpeg") {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width;
        let h = img.height;
        if (w > h) {
          if (w > maxSize) {
            h = Math.round(h * (maxSize / w));
            w = maxSize;
          }
        } else {
          if (h > maxSize) {
            w = Math.round(w * (maxSize / h));
            h = maxSize;
          }
        }
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        if (format === "png") {
          resolve(canvas.toDataURL("image/png"));
        } else {
          resolve(canvas.toDataURL("image/jpeg", 0.82));
        }
      };
      img.onerror = () => reject(new Error("Não foi possível ler essa imagem."));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("Não foi possível ler esse arquivo."));
    reader.readAsDataURL(file);
  });
}

function loadScriptOnce(src, timeoutMs = 6000) {
  return new Promise((resolve, reject) => {
    let settled = false;
    const timer = setTimeout(() => {
      if (!settled) {
        settled = true;
        reject(new Error("Tempo esgotado carregando script: " + src));
      }
    }, timeoutMs);
    const finish = (fn) => (...args) => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      fn(...args);
    };
    const existing = document.querySelector(`script[src="${src}"]`);
    if (existing) {
      if (existing.dataset.loaded === "true") return finish(resolve)();
      existing.addEventListener("load", finish(resolve));
      existing.addEventListener("error", finish(() => reject(new Error("Falha ao carregar " + src))));
      return;
    }
    const script = document.createElement("script");
    script.src = src;
    script.async = true;
    script.onload = finish(() => {
      script.dataset.loaded = "true";
      resolve();
    });
    script.onerror = finish(() => reject(new Error("Falha ao carregar " + src)));
    document.head.appendChild(script);
  });
}

let firestoreDbPromise = null;

function getFirestoreDb() {
  if (firestoreDbPromise) return firestoreDbPromise;
  firestoreDbPromise = (async () => {
    await loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.js");
    await loadScriptOnce("https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.js");
    if (!window.firebase.apps || !window.firebase.apps.length) {
      window.firebase.initializeApp(FIREBASE_CONFIG);
    }
    return window.firebase.firestore();
  })();
  return firestoreDbPromise;
}

let globalDbgSink = null;
function reportError(msg) {
  console.error(msg);
  if (globalDbgSink) globalDbgSink("⚠️ " + msg);
}

function withTimeout(promise, ms, label) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(`Tempo esgotado (${ms}ms): ${label}`)), ms)),
  ]);
}

// Confere direto no Firestore se um documento realmente existe — usado para
// avisar o usuário quando alguma ação não conseguiu ser salva de verdade.
async function verifyPersisted(key) {
  try {
    const db = await withTimeout(getFirestoreDb(), 8000, "conectar ao Firestore");
    const doc = await withTimeout(db.collection(FIRESTORE_COLLECTION).doc(key).get(), 8000, "verifyPersisted:" + key);
    return doc.exists;
  } catch (e) {
    reportError("verifyPersisted(" + key + "): " + e.message);
    return false;
  }
}

async function getJSON(key) {
  try {
    const db = await withTimeout(getFirestoreDb(), 8000, "conectar ao Firestore");
    const doc = await withTimeout(db.collection(FIRESTORE_COLLECTION).doc(key).get(), 8000, "getJSON:" + key);
    if (!doc.exists) return null;
    const data = doc.data();
    return data && data.value !== undefined ? JSON.parse(data.value) : null;
  } catch (e) {
    reportError("getJSON(" + key + "): " + e.message);
    return null;
  }
}

async function setJSON(key, value) {
  try {

      8000,
      "setJSON:" + key
    );
    return true;
  } catch (e) {
    reportError("setJSON(" + key + "): " + e.message);
    return false;
  }
}

async function deleteJSON(key) {

// Adiciona um item a uma lista-índice (users_index, rounds_index, competitions_index...)
// de forma ATÔMICA via transação do Firestore — evita que duas pessoas cadastrando ao
// mesmo tempo se "sobrescrevam" e percam registro uma da outra.
async function appendToIndexAtomic(indexKey, value) {
  try {
    const db = await withTimeout(getFirestoreDb(), 8000, "conectar ao Firestore");
    const docRef = db.collection(FIRESTORE_COLLECTION).doc(indexKey);
    await withTimeout(
      db.runTransaction(async (transaction) => {
        const doc = await transaction.get(docRef);
        let arr = [];
        if (doc.exists) {
          const data = doc.data();
          arr = data && data.value !== undefined ? JSON.parse(data.value) : [];
        }
        if (!arr.includes(value)) arr.push(value);
        transaction.set(docRef, { value: JSON.stringify(arr) });
      }),
      8000,
      "appendToIndexAtomic:" + indexKey
    );
    return true;
  } catch (e) {
    reportError("appendToIndexAtomic(" + indexKey + "): " + e.message);
    return false;
  }
}

// Remove um item de uma lista-índice, também de forma atômica.
async function removeFromIndexAtomic(indexKey, value) {
  try {
    const db = await withTimeout(getFirestoreDb(), 8000, "conectar ao Firestore");
    const docRef = db.collection(FIRESTORE_COLLECTION).doc(indexKey);
    await withTimeout(
      db.runTransaction(async (transaction) => {
        const doc = await transaction.get(docRef);
        let arr = [];
        if (doc.exists) {
          const data = doc.data();
          arr = data && data.value !== undefined ? JSON.parse(data.value) : [];
        }
        arr = arr.filter((x) => x !== value);
        transaction.set(docRef, { value: JSON.stringify(arr) });
      }),
      8000,
      "removeFromIndexAtomic:" + indexKey
    );
    return true;
  } catch (e) {
    reportError("removeFromIndexAtomic(" + indexKey + "): " + e.message);
    return false;
  }
}

async function listKeys(prefix) {
  try {
    const db = await withTimeout(getFirestoreDb(), 8000, "conectar ao Firestore");
    const FieldPath = window.firebase.firestore.FieldPath;
    const snapshot = await withTimeout(
      db
        .collection(FIRESTORE_COLLECTION)
        .where(FieldPath.documentId(), ">=", prefix)
        .where(FieldPath.documentId(), "<", prefix + "\uf8ff")
        .get(),
      8000,
      "listKeys:" + prefix
    );
    return snapshot.docs.map((d) => d.id);
  } catch (e) {
    reportError("listKeys(" + prefix + "): " + e.message);
    return [];
  }
}


async function loadAllData() {
  const competitionKeys = await listKeys("competition:");
  const competitions = [];
  for (const key of competitionKeys) {
    const c = await getJSON(key);
    if (c) competitions.push(c);
  }
  competitions.sort((a, b) => a.createdAt - b.createdAt);

  const roundKeys = await listKeys("round:");
  const rounds = [];
  for (const key of roundKeys) {
    const r = await getJSON(key);
    if (r) rounds.push(r);
  }
  rounds.sort((a, b) => a.createdAt - b.createdAt);

  const userKeys = await listKeys("user:");
  const users = [];
  for (const key of userKeys) {
    const u = await getJSON(key);
    if (u) users.push(u);
  }

  let picksMap = {};

  return { competitions, rounds, users, picksMap };

/* ---------------------------------------------------------
   SCORING HELPERS
--------------------------------------------------------- */
function pickKey(gameId, username) {
  return `pick:${gameId}::${username}`;
}

function gameStarted(game) {
  return Date.now() >= new Date(game.startTime).getTime();
}

// Os palpites de TODA a rodada travam assim que o primeiro jogo dela (pelo horário) começa.
function roundLocked(round) {
  if (!round || !round.games || round.games.length === 0) return false;
  const firstGame = [...round.games].sort((a, b) => new Date(a.startTime) - new Date(b.startTime))[0];
  return gameStarted(firstGame);
}

const FORMAT_MATCHBALL = "Matchball";
const FORMAT_SHOOTOUT = "Shootout";

// returns { points, status } where status: 'pending' | 'wo' | 'wrong' | 'correct'
// `locked` indica se a rodada desse jogo já travou (primeiro jogo da rodada já começou)
function computeGameOutcome(game, pick, locked) {
  if (!pick) {
    return locked ? { points: 0, status: "wo" } : { points: 0, status: "not_started" };
  }
  if (game.status !== "finished") {
    return { points: 0, status: "pending" };
  }
  const correct = pick.winner === game.resultWinner;
  let points = 0;
  if (correct) points += 3;
  if (correct && game.resultFormat === FORMAT_SHOOTOUT && pick.format === FORMAT_SHOOTOUT) points += 3;
  if (correct && game.resultFormat === FORMAT_MATCHBALL && pick.format === FORMAT_MATCHBALL) points += 2;
  return { points, status: correct ? "correct" : "wrong" };
}

function isRoundFinished(round) {
  return round.games.length > 0 && round.games.every((g) => g.status === "finished");
}

function computeUserRoundPoints(round, username, picksMap) {
  let total = 0;
  const locked = roundLocked(round);
  for (const g of round.games) {
    const pick = picksMap[pickKey(g.id, username)];
    total += computeGameOutcome(g, pick, locked).points;
  }
  return total;
}

function computeRoundMedals(round, users, picksMap) {
  const result = {};
  if (!isRoundFinished(round)) return result;
  const scores = users.map((u) => ({ username: u.username, score: computeUserRoundPoints(round, u.username, picksMap) }));
  // as 3 maiores PONTUAÇÕES distintas levam medalha — todo mundo empatado numa
  // mesma pontuação recebe a mesma medalha (não é limitado a 3 pessoas)
  const distinctScoresDesc = Array.from(new Set(scores.map((s) => s.score))).sort((a, b) => b - a);
  const medalForScore = {};
  if (distinctScoresDesc[0] !== undefined) medalForScore[distinctScoresDesc[0]] = "gold";
  if (distinctScoresDesc[1] !== undefined) medalForScore[distinctScoresDesc[1]] = "silver";
  if (distinctScoresDesc[2] !== undefined) medalForScore[distinctScoresDesc[2]] = "bronze";
  for (const s of scores) {
    const medal = medalForScore[s.score];
    if (medal) result[s.username] = medal;
  }
  return result;
}

function computeRanking(rounds, users, picksMap) {
  return users
    .map((u) => {
      let totalPoints = 0;
      let medals = { gold: 0, silver: 0, bronze: 0 };
      for (const round of rounds) {
        totalPoints += computeUserRoundPoints(round, u.username, picksMap);
        const roundMedals = computeRoundMedals(round, users, picksMap);
        const m = roundMedals[u.username];
        if (m) medals[m] += 1;
      }
      return { username: u.username, displayName: u.displayName, avatar: u.avatar || null, totalPoints, medals };
    })
    .sort((a, b) => {
      if (b.totalPoints !== a.totalPoints) return b.totalPoints - a.totalPoints;
      if (b.medals.gold !== a.medals.gold) return b.medals.gold - a.medals.gold;
      if (b.medals.silver !== a.medals.silver) return b.medals.silver - a.medals.silver;
      if (b.medals.bronze !== a.medals.bronze) return b.medals.bronze - a.medals.bronze;
      return a.displayName.localeCompare(b.displayName);
    });
}

// Estatísticas de um jogador considerando TODAS as competições/rodadas já cadastradas.
function computeUserStats(username, competitions, allRounds, picksMap) {
  const forCounts = {}; // time escolhido como vencedor -> {name, logo, count}
  const againstCounts = {}; // time preterido (escolheu o adversário dele) -> {name, logo, count}
  const teamPoints = {}; // time escolhido como vencedor -> {name, logo, points}
  let totalDecided = 0; // palpites em jogos já finalizados
  let correct = 0;

  for (const round of allRounds) {
    const competition = competitions.find((c) => c.id === round.competitionId);
    for (const game of round.games) {
      const pick = picksMap[pickKey(game.id, username)];
      if (!pick) continue;

      const winnerTeamId = pick.winner === "team1" ? game.team1Id : game.team2Id;
      const loserTeamId = pick.winner === "team1" ? game.team2Id : game.team1Id;
      const winnerTeam = getTeam(competition, winnerTeamId);
      const loserTeam = getTeam(competition, loserTeamId);

      if (winnerTeam) {
        if (!forCounts[winnerTeam.name]) forCounts[winnerTeam.name] = { name: winnerTeam.name, logo: winnerTeam.logo || null, count: 0 };
        forCounts[winnerTeam.name].count += 1;
        if (!forCounts[winnerTeam.name].logo && winnerTeam.logo) forCounts[winnerTeam.name].logo = winnerTeam.logo;
      }
      if (loserTeam) {
        if (!againstCounts[loserTeam.name]) againstCounts[loserTeam.name] = { name: loserTeam.name, logo: loserTeam.logo || null, count: 0 };
        againstCounts[loserTeam.name].count += 1;
        if (!againstCounts[loserTeam.name].logo && loserTeam.logo) againstCounts[loserTeam.name].logo = loserTeam.logo;
      }

      if (game.status === "finished") {
        totalDecided += 1;
        if (pick.winner === game.resultWinner) correct += 1;

        if (winnerTeam) {
          const outcome = computeGameOutcome(game, pick, true);
          if (!teamPoints[winnerTeam.name]) teamPoints[winnerTeam.name] = { name: winnerTeam.name, logo: winnerTeam.logo || null, points: 0 };
          teamPoints[winnerTeam.name].points += outcome.points;
          if (!teamPoints[winnerTeam.name].logo && winnerTeam.logo) teamPoints[winnerTeam.name].logo = winnerTeam.logo;
        }
      }
    }
  }

  const mostPicked = Object.values(forCounts)
    .sort((a, b) => b.count - a.count)
    .slice(0, 5);
  // "menos palpitou a favor" agora mostra os times contra os quais o jogador mais
  // escolheu o adversário — ou seja, os times que ele mais preteriu
  const mostPickedAgainst = Object.values(againstCounts)
    .sort((a, b) => b.count - a.count)
    .slice(0, 5);

  const teamsWithPoints = Object.values(teamPoints);
  const mostPointsTeams = [...teamsWithPoints].sort((a, b) => b.points - a.points).slice(0, 5);
  const leastPointsTeams = [...teamsWithPoints].sort((a, b) => a.points - b.points).slice(0, 5);

  return {
    totalDecided,
    correct,
    winRate: totalDecided > 0 ? (correct / totalDecided) * 100 : null,
    mostPicked,
    leastPicked: mostPickedAgainst,
    mostPointsTeams,
    leastPointsTeams,
  };
}

// Compara os palpites de um jogador com os de todos os outros, contando quantos
// palpites idênticos (mesmo vencedor E mesmo formato) eles tiveram em confrontos
// que os dois palpitaram, em toda a história de todas as competições.
function computeSimilarUsers(username, users, allRounds, picksMap) {
  const others = users.filter((u) => u.username !== username);
  const results = others.map((other) => {
    let sameCount = 0;
    let comparedCount = 0;
    for (const round of allRounds) {
      for (const game of round.games) {
        const myPick = picksMap[pickKey(game.id, username)];
        const otherPick = picksMap[pickKey(game.id, other.username)];
        if (!myPick || !otherPick) continue;
        comparedCount += 1;
        if (myPick.winner === otherPick.winner && myPick.format === otherPick.format) {
          sameCount += 1;
        }
      }
    }
    return {
      username: other.username,
      displayName: other.displayName,
      avatar: other.avatar || null,
      sameCount,
      comparedCount,
    };
  });
  return results
    .filter((r) => r.comparedCount > 0)
    .sort((a, b) => b.sameCount - a.sameCount || b.comparedCount - a.comparedCount);
}

// Converte um valor de <input type="datetime-local"> (ex: "2026-07-24T15:30"),
// tratando-o explicitamente como horário de Brasília (UTC-3, sem horário de verão desde 2019),
// em um instante UTC real — independente do fuso do navegador de quem estiver cadastrando.
function brasiliaLocalToISO(localDateTimeStr) {
  if (!localDateTimeStr) return null;
  return new Date(`${localDateTimeStr}:00-03:00`).toISOString();
}

// Converte um instante UTC (ISO) de volta para o formato aceito por
// <input type="datetime-local">, exibindo no horário de Brasília.
function isoToBrasiliaLocalInput(iso) {
  if (!iso) return "";
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "America/Sao_Paulo",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    hour12: false,
  }).formatToParts(new Date(iso));
  const get = (type) => parts.find((p) => p.type === type)?.value;
  return `${get("year")}-${get("month")}-${get("day")}T${get("hour")}:${get("minute")}`;
}

function fmtDate(iso) {
  try {
    const d = new Date(iso);
    const formatted = d.toLocaleString("pt-BR", {
      day: "2-digit",
      month: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      timeZone: "America/Sao_Paulo",
    });
    return `${formatted} (Brasília)`;
  } catch (e) {
    return iso;
  }
}

    }
    setStorageOk(ok);
    setCheckingStorage(false);
    return ok;
  }, []);

    const ok = await runStorageHealthcheck();

  }

  useEffect(() => {
    let finished = false;
    const safetyTimer = setTimeout(() => {
      if (!finished) {
        console.error("Inicialização demorou demais, liberando a tela mesmo assim.");
        setStorageOk(false);
        setLoading(false);
      }
    }, 10000);

    (async () => {
      try {
        await runStorageHealthcheck();
        await ensureAdminSeeded();
        const d = await refresh();

        // tenta restaurar a sessão salva no navegador, se existir e o usuário ainda existir
        const savedUsername = localStorage.getItem("bolao_session_username");

          }

      } catch (e) {
        console.error("Erro na inicialização:", e);
      } finally {
        finished = true;
        clearTimeout(safetyTimer);
        setLoading(false);
      }
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // atualiza os dados automaticamente a cada 15s (classificação, resultados, etc
  // aparecem para todo mundo sem precisar recarregar a página manualmente)
  useEffect(() => {
    if (!session) return;
    const interval = setInterval(() => {
      refresh();

    setDebugLog((prev) => [...prev.slice(-11), `${new Date().toLocaleTimeString()} ${line}`]);

  async function handleAuthSubmit(e) {
    if (e && e.preventDefault) e.preventDefault();
    dbg("[bolao] submit fired, mode:", authMode);
    if (authSubmitting) {
      dbg("[bolao] blocked: already submitting");
      return;
    }
    const username = authForm.username.trim().toLowerCase();
    const password = authForm.password;
    if (!username || !password) {
      dbg("[bolao] blocked: missing username/password");
      showToast("Preencha usuário e senha.", "error");
      return;
    }
    if (!/^[a-z0-9_]{3,20}$/.test(username)) {
      dbg("[bolao] blocked: invalid username format", username);
      showToast("Usuário deve ter 3-20 caracteres (letras, números, _).", "error");
      return;
    }
    setAuthSubmitting(true);
    try {
      if (authMode === "login") {
        dbg("[bolao] attempting login for", username);
        const u = await getJSON(`user:${username}`);
        dbg("[bolao] login lookup result:", u);
        if (!u || u.password !== password) {
          showToast("Usuário ou senha inválidos.", "error");
          return;
        }
        setSession({ username: u.username, displayName: u.displayName, isAdmin: !!u.isAdmin });
        localStorage.setItem("bolao_session_username", u.username);
        showToast(`Bem-vindo, ${u.displayName}!`, "success");
      } else {
        dbg("[bolao] attempting register for", username);
        const existing = await getJSON(`user:${username}`);
        dbg("[bolao] existing user check:", existing);
        if (existing) {
          showToast("Esse usuário já existe. Tente entrar ou escolha outro nome de usuário.", "error");
          return;
        }
        const displayName = authForm.displayName.trim() || username;
        const newUser = { username, password, displayName, isAdmin: false };

        const savedUser = await setJSON(`user:${username}`, newUser);
        dbg("[bolao] setJSON user result:", savedUser);
        if (!savedUser) {
          showToast("Não consegui salvar a conta. Verifique a conexão e tente de novo.", "error");
          return;
        }


        const check = await getJSON(`user:${username}`);
        dbg("[bolao] verification read-back:", check);
        if (!check) {
          showToast("Algo deu errado ao criar a conta. Tente novamente.", "error");
          return;
        }

        setSession({ username, displayName, isAdmin: false });
        localStorage.setItem("bolao_session_username", username);
        showToast(`Conta criada! Bem-vindo, ${displayName}!`, "success");
        dbg("[bolao] session set, entering app");
        await refresh();
      }
      setAuthForm({ username: "", password: "", displayName: "" });
    } catch (err) {
      console.error("[bolao] Auth error (caught):", err);
      showToast("Erro inesperado. Tente novamente.", "error");
    } finally {
      setAuthSubmitting(false);
      dbg("[bolao] submit finished");
    }
  }

      const gameIds = new Set();
      rounds.forEach((r) => (r.games || []).forEach((g) => gameIds.add(g.id)));
      const pickKeys = await listKeys("pick:");
      for (const k of pickKeys) {

                      ? "bg-amber-500/15 border-l-4 border-l-amber-400"

                    ? "bg-red-600/10 border-l-4 border-l-red-500"
                    : "border-l-4 border-l-transparent";
                  const prevPos = previousPositionByUser[r.username];
                  const currentPos = i + 1;
                  let moveIndicator = null;
                  if (prevPos !== undefined) {
                    if (prevPos > currentPos) {
                      moveIndicator = (
                        <span
                          className="text-emerald-400 text-[10px] font-bold"
                          title={`Subiu ${prevPos - currentPos} posição(ões)`}

                  value={profileForm.confirmPassword}
                  onChange={(e) => setProfileForm({ ...profileForm, confirmPassword: e.target.value })}
                  onKeyDown={(e) => {
                    if (e.key === "Enter") saveProfile();
                  }}
                  placeholder="••••••••"
                  className="w-full bg-emerald-900 border border-emerald-800 rounded-md px-3 py-2 text-sm outline-none focus:border-amber-400 mb-3"
                />
              </>
            )}

            <p className="text-[11px] text-stone-500 mb-4">
              Lembre-se: como já combinamos, as senhas aqui não usam criptografia — não reutilize uma senha importante.
            </p>

            <div className="flex gap-2">
              <button
                onClick={() => setProfileModalOpen(false)}
                className="flex-1 py-2 rounded-md text-sm font-medium bg-emerald-900 hover:bg-emerald-800 border border-emerald-700"
              >
                Cancelar
              </button>
              <button
                onClick={saveProfile}
                disabled={profileSaving}
                className="flex-1 flex items-center justify-center gap-2 py-2 rounded-md text-sm font-semibold bg-amber-500 hover:bg-amber-400 disabled:opacity-60 text-emerald-950"
              >
                {profileSaving ? <RefreshCw size={14} className="animate-spin" /> : <CheckCircle2 size={14} />}
                {profileSaving ? "Salvando..." : "Salvar"}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
